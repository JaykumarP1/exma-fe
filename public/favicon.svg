<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#31121f" />
    </linearGradient>
    <linearGradient id="gem-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
  
  <!-- Outer Gem Glow Accent -->
  <circle cx="32" cy="32" r="18" fill="rgba(225, 29, 72, 0.15)" />

  <!-- Gem Logo Icon Path (Lucide Gem Polygon Geometry) -->
  <g filter="url(#glow)">
    <!-- Top facets -->
    <path d="M22 18 L42 18 L50 28 L32 50 L14 28 Z" fill="none" stroke="url(#gem-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M14 28 L50 28" stroke="url(#gem-grad)" stroke-width="3" stroke-linecap="round" />
    <path d="M22 18 L28 28 L32 50 L36 28 L42 18" fill="none" stroke="url(#gem-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

